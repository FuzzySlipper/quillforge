name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/QuillForge.Web/Client/package-lock.json
      - name: Validate release configuration
        run: scripts/check-release-config.sh
      - run: dotnet restore QuillForge.slnx
      - run: dotnet build QuillForge.slnx --no-restore -c Release -p:AllowMissingPrunePackageData=true
      - run: dotnet test QuillForge.slnx --no-build -c Release -p:AllowMissingPrunePackageData=true

  release-preflight:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate tag and release configuration
        run: scripts/check-release-config.sh
        env:
          EXPECT_RELEASE_TAG: ${{ github.ref_name }}

  desktop-bundles:
    needs: release-preflight
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: desktop-linux-x64-appimage
            electron_cli: --linux appimage
            dotnet_rid: linux-x64
          - os: ubuntu-22.04
            artifact_name: desktop-linux-x64-rpm
            electron_cli: --linux rpm
            dotnet_rid: linux-x64
          - os: macos-latest
            artifact_name: desktop-macos-x64
            electron_cli: --mac --x64
            dotnet_rid: osx-x64
          - os: macos-latest
            artifact_name: desktop-macos-arm64
            electron_cli: --mac --arm64
            dotnet_rid: osx-arm64
          - os: windows-latest
            artifact_name: desktop-windows-x64
            electron_cli: --win nsis
            dotnet_rid: win-x64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            src/QuillForge.Web/Client/package-lock.json
            src/QuillForge.Desktop/package-lock.json

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libatspi2.0-dev libdrm-dev libgbm-dev patchelf rpm

      - name: Install web frontend dependencies
        run: npm ci
        working-directory: src/QuillForge.Web/Client

      - name: Install desktop dependencies
        run: npm ci
        working-directory: src/QuillForge.Desktop

      - name: Restore NuGet packages
        run: dotnet restore QuillForge.slnx

      - name: Publish .NET backend
        shell: bash
        run: |
          dotnet publish src/QuillForge.Web/QuillForge.Web.csproj \
            -c Release -r ${{ matrix.dotnet_rid }} --self-contained \
            -p:PublishSingleFile=true \
            -p:IncludeNativeLibrariesForSelfExtract=true \
            -o src/QuillForge.Desktop/backend-payload

      - name: Build desktop bundles
        shell: bash
        run: |
          npx electron-builder ${{ matrix.electron_cli }} --publish never
        working-directory: src/QuillForge.Desktop

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/release-assets"
          if [ -d dist ]; then
            # Copy distributables plus electron-updater metadata; exclude only builder debug logs.
            find dist -maxdepth 1 -type f \( \
              -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o \
              -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o \
              -name '*.blockmap' -o -name '*.yml' -o \
              -name 'latest*' \
            \) ! -name 'builder-debug.yml' -exec cp {} "${{ github.workspace }}/release-assets/" \;
          fi
          echo "=== Staged assets ==="
          ls -la "${{ github.workspace }}/release-assets/"
        working-directory: src/QuillForge.Desktop

      - name: Upload staged assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: warn

  release:
    needs: desktop-bundles
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create or update GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.ref_name }}"

          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; reusing it."
          else
            gh release create "$tag" --generate-notes
          fi

          upload_with_retry() {
            local file="$1"
            local attempt
            for attempt in 1 2 3 4 5; do
              if gh release upload "$tag" "$file" --clobber; then
                return 0
              fi
              echo "Upload failed for $file (attempt $attempt/5)." >&2
              if [[ "$attempt" == 5 ]]; then
                return 1
              fi
              sleep $((attempt * 10))
            done
          }

          while IFS= read -r -d '' file; do
            upload_with_retry "$file"
          done < <(find release-assets -type f -print0 | sort -z)
        env:
          GH_TOKEN: ${{ github.token }}
