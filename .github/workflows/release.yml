name: Release

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: src/QuillForge.Web/Client/package-lock.json
      - run: dotnet restore QuillForge.slnx
      - run: dotnet build QuillForge.slnx --no-restore -c Release
      - run: dotnet test QuillForge.slnx --no-build -c Release

  desktop-bundles:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact_name: desktop-linux-x64-appimage
            electron_cli: --linux appimage
          - os: ubuntu-22.04
            artifact_name: desktop-linux-x64-rpm
            electron_cli: --linux rpm
          - os: macos-latest
            artifact_name: desktop-macos-x64
            electron_cli: --mac --x64
          - os: macos-latest
            artifact_name: desktop-macos-arm64
            electron_cli: --mac --arm64
          - os: windows-latest
            artifact_name: desktop-windows-x64
            electron_cli: --win nsis

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            src/QuillForge.Web/Client/package-lock.json
            src/QuillForge.Desktop/package-lock.json

      - name: Install Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libnotify-dev libnss3 libxss1 libatspi2.0-dev libdrm-dev libgbm-dev patchelf rpm

      - name: Install web frontend dependencies
        run: npm ci
        working-directory: src/QuillForge.Web/Client

      - name: Install desktop dependencies
        run: npm ci
        working-directory: src/QuillForge.Desktop

      - name: Build desktop bundles
        shell: bash
        run: |
          npx electron-builder ${{ matrix.electron_cli }} --publish never
        working-directory: src/QuillForge.Desktop

      - name: Stage release assets
        shell: bash
        run: |
          mkdir -p "${{ github.workspace }}/release-assets"
          if [ -d dist ]; then
            # Only copy distributable files (no unpacked app bundles)
            find dist -maxdepth 1 -type f \( \
              -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o \
              -name '*.deb' -o -name '*.rpm' -o -name '*.exe' -o \
              -name '*.blockmap' -o -name '*.yml' -o \
              -name 'latest*' \
            \) -exec cp {} "${{ github.workspace }}/release-assets/" \;
          fi
          echo "=== Staged assets ==="
          ls -la "${{ github.workspace }}/release-assets/"
        working-directory: src/QuillForge.Desktop

      - name: Upload staged assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: release-assets/*
          if-no-files-found: warn

  release:
    needs: desktop-bundles
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        run: |
          gh release create "${{ github.ref_name }}" \
            $(find release-assets -type f) \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
